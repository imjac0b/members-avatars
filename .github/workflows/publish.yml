name: Publish avatars

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2

      # The last run's images, so only avatars whose URL changed are downloaded.
      - name: Restore avatars cache
        uses: actions/cache/restore@v5
        with:
          path: avatars
          key: avatars-${{ github.run_id }}
          restore-keys: avatars-

      # The last run's posts, so only posts newer than those are fetched.
      - name: Restore posts cache
        uses: actions/cache/restore@v5
        with:
          path: "080204"
          key: posts-${{ github.run_id }}
          restore-keys: posts-

      - name: Sync avatars and README
        env:
          PUBLIC_BASE_URL: https://members-avatar.jacob.com.hk
        run: bun run sync

      # Keyed on the list of image URLs, so a new cache is only saved when an image changed.
      - name: Save avatars cache
        uses: actions/cache/save@v5
        with:
          path: avatars
          key: avatars-${{ hashFiles('avatars/.sources.json') }}

      - name: Fetch new Weverse posts
        env:
          PUBLIC_BASE_URL: https://members-avatar.jacob.com.hk
        run: bun run posts

      - name: Save posts cache
        uses: actions/cache/save@v5
        with:
          path: "080204"
          key: posts-${{ hashFiles('080204/**') }}

      - name: Add posts to the site
        run: cp -R 080204 avatars/080204

      - name: Commit README updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: update generated avatar catalog"
          file_pattern: README.md

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: avatars

      # deploy-pages sometimes looks for the artifact before GitHub lists it
      # and fails with "No artifacts named github-pages", so wait until it shows,
      # then a little longer, since the listing it reads can lag behind.
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            [ "$n" -gt 0 ] && sleep 15 && exit 0
            sleep 2
          done
          echo "github-pages artifact not listed yet; trying the deploy anyway"

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # One more try if the deploy still didn't find the artifact.
      - name: Wait before trying the deploy again
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (second try)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
