name: Publish avatars

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Sync avatars and README
        env:
          PUBLIC_BASE_URL: https://members-avatar.jacob.com.hk
        run: bun run sync

      - name: Commit README updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update generated avatar catalog"
          file_pattern: README.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: avatars

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
